# Local development stack.
#   docker compose up -d db                 -> PostgreSQL only (run API/worker/UI from source)
#   docker compose --profile full up --build -> everything in containers, mirroring the ECS services
#   docker compose --profile vault up -d --build vault vault-setup
#                                           -> the locked teardown vault (MinIO with Object Lock, §23); then create
#                                              its buckets with `uv run python -m app.adapters.minio_backup`
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cloudinfra
      POSTGRES_PASSWORD: cloudinfra
      POSTGRES_DB: cloudinfra
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudinfra -d cloudinfra"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    profiles: ["full"]
    build: ./backend
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://cloudinfra:cloudinfra@db:5432/cloudinfra
      GITHUB_MODE: local
      AWS_MODE: local
      LOCAL_STATE_DIR: /var/cloudinfra
    volumes:
      - ${CLOUDINFRA_STATE_DIR:-./var/state}:/var/cloudinfra
    ports:
      - "8010:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    profiles: ["full"]
    build: ./backend
    command: ["python", "-m", "app.provisioning.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://cloudinfra:cloudinfra@db:5432/cloudinfra
      GITHUB_MODE: local
      AWS_MODE: local
      LOCAL_STATE_DIR: /var/cloudinfra
    volumes:
      - ${CLOUDINFRA_STATE_DIR:-./var/state}:/var/cloudinfra
    depends_on:
      db:
        condition: service_healthy

  ui:
    profiles: ["full"]
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

  vault:
    profiles: ["vault"]
    build: ./infra/local-vault
    image: cloudinfra-vault:local
    environment:
      MINIO_ROOT_USER: ${VAULT_ADMIN_ACCESS_KEY:-cloudinfra-admin}
      MINIO_ROOT_PASSWORD: ${VAULT_ADMIN_SECRET_KEY:-cloudinfra-admin-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - vaultdata:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20

  vault-setup:
    profiles: ["vault"]
    build: ./infra/local-vault
    image: cloudinfra-vault:local
    entrypoint: ["bash", "/setup/setup-users.sh"]
    environment:
      VAULT_ADMIN_ACCESS_KEY: ${VAULT_ADMIN_ACCESS_KEY:-cloudinfra-admin}
      VAULT_ADMIN_SECRET_KEY: ${VAULT_ADMIN_SECRET_KEY:-cloudinfra-admin-secret}
      VAULT_PLATFORM_SECRET_KEY: ${VAULT_PLATFORM_SECRET_KEY:-cloudinfra-platform-secret}
      VAULT_SUPER_USER_SECRET_KEY: ${VAULT_SUPER_USER_SECRET_KEY:-cloudinfra-super-user-secret}
    volumes:
      - ./infra/local-vault:/setup:ro
    depends_on:
      vault:
        condition: service_healthy

volumes:
  pgdata:
  vaultdata:
