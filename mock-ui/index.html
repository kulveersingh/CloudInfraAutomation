<title>CloudInfra Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&display=swap">
<style>
/* Layout: operations console — fixed left rail of destinations, a working canvas, state shown as chips and stripes. */
:root{
  --bg:#F3F5F6; --surface:#FFFFFF; --sunken:#E9EDEF; --line:#D5DCE0; --line-strong:#B4BFC6;
  --fg:#16222B; --muted:#53636E; --faint:#7C8B95;
  --accent:#0B6E79; --accent-ink:#FFFFFF; --accent-soft:#DDF0F1;
  --rail:#12232D; --rail-fg:#C9D6DD; --rail-active:#1E3A47;
  --ok:#2E7D32; --ok-soft:#E3F1E4; --warn:#B26A00; --warn-soft:#FBEFD9; --crit:#B3261E; --crit-soft:#F8E1DF; --info:#2C5AA0; --info-soft:#E1EAF7;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-display:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E171D; --surface:#15222A; --sunken:#1B2B34; --line:#2A3C47; --line-strong:#3B515E;
  --fg:#E4ECF0; --muted:#A3B3BC; --faint:#7F919B;
  --accent:#4FB7C2; --accent-ink:#06262A; --accent-soft:#163D43;
  --rail:#0A1318; --rail-fg:#B9C8D0; --rail-active:#1A2F3A;
  --ok:#7CC583; --ok-soft:#1B3320; --warn:#E3A84A; --warn-soft:#3A2C12; --crit:#F08B83; --crit-soft:#3D1D1B; --info:#86AEEA; --info-soft:#1C2B42;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E171D; --surface:#15222A; --sunken:#1B2B34; --line:#2A3C47; --line-strong:#3B515E;
  --fg:#E4ECF0; --muted:#A3B3BC; --faint:#7F919B;
  --accent:#4FB7C2; --accent-ink:#06262A; --accent-soft:#163D43;
  --rail:#0A1318; --rail-fg:#B9C8D0; --rail-active:#1A2F3A;
  --ok:#7CC583; --ok-soft:#1B3320; --warn:#E3A84A; --warn-soft:#3A2C12; --crit:#F08B83; --crit-soft:#3D1D1B; --info:#86AEEA; --info-soft:#1C2B42;
  color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
/* rail */
.rail{background:var(--rail);color:var(--rail-fg);padding-block:18px;display:flex;flex-direction:column;gap:18px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto}
.brand{padding-inline:18px;display:flex;flex-direction:column;gap:2px}
.brand b{font-family:var(--f-display);font-size:19px;letter-spacing:.01em;color:#FFFFFF}
.brand span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.nav{display:flex;flex-direction:column;gap:2px;padding-inline:10px}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:var(--r);color:var(--rail-fg);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--rail-active)}
.nav a.on{background:var(--rail-active);color:#FFFFFF;box-shadow:inset 3px 0 0 var(--accent)}
.nav .count{font-family:var(--f-mono);font-size:11px;background:#C46A1A;color:#FFFFFF;border-radius:10px;padding:0 7px}
.nav-label{padding-inline:20px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.55;margin-top:6px}
.rail-foot{margin-top:auto;padding-inline:18px;font-size:12px;opacity:.75;display:flex;flex-direction:column;gap:6px}
/* main */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.crumbs{font-size:13px;color:var(--muted);flex:1;min-width:0}
.crumbs b{color:var(--fg)}
.mock{font-family:var(--f-mono);font-size:11px;background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn);border-radius:4px;padding:1px 7px;letter-spacing:.04em}
.role{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
select,input[type=text],input[type=search],textarea{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);padding:6px 9px;min-width:0}
textarea{width:100%;resize:vertical}
.content{padding:22px 24px 48px;display:flex;flex-direction:column;gap:20px;max-width:1280px;width:100%}
h1{font-family:var(--f-display);font-size:26px;line-height:1.15;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-size:18px;margin:0;text-wrap:balance}
h3{font-size:14px;margin:0;font-weight:600}
.sub{color:var(--muted);margin:2px 0 0;max-width:72ch}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel-h{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.panel-b{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r);padding:6px 12px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--crit);border-color:var(--crit);color:#FFFFFF}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600}
.mono{font-family:var(--f-mono);font-size:12.5px}
.muted{color:var(--muted)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunken)}
.num{font-variant-numeric:tabular-nums;font-family:var(--f-mono)}
/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:999px;padding:1px 9px;border:1px solid transparent;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.idle{background:var(--sunken);color:var(--muted)}
.tag{font-family:var(--f-mono);font-size:11.5px;background:var(--sunken);border:1px solid var(--line);border-radius:4px;padding:1px 6px;white-space:nowrap}
.tag b{color:var(--accent);font-weight:500}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{padding:14px 16px}
.kpi .v{font-family:var(--f-display);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .k{font-size:12px;color:var(--muted)}
/* pipeline */
.pipe{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:10px;overflow-x:auto;padding-bottom:4px}
.stage{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:6px;position:relative;min-width:0}
.stage.gated{border-color:var(--warn)}
.stage .env{font-family:var(--f-display);font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.stage .meta{font-size:12px;color:var(--muted)}
.stage .chip{align-self:flex-start}
td.mono{white-space:nowrap}
.stage .stripe{position:absolute;inset:0 auto 0 0;width:4px;border-radius:var(--r) 0 0 var(--r)}
.gates{display:flex;gap:4px;flex-wrap:wrap}
.g{font-family:var(--f-mono);font-size:10.5px;border-radius:3px;padding:0 5px;border:1px solid var(--line)}
.g.p{color:var(--ok);border-color:var(--ok)} .g.f{color:var(--crit);border-color:var(--crit)} .g.w{color:var(--faint)}
/* wizard */
.steps{display:flex;gap:6px;flex-wrap:wrap;counter-reset:s}
.step{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:500;cursor:pointer}
.step i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--sunken);font-size:12px;font-family:var(--f-mono)}
.step.on{border-color:var(--accent);color:var(--fg)} .step.on i{background:var(--accent);color:var(--accent-ink)}
.step.done i{background:var(--ok-soft);color:var(--ok)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-weight:600;font-size:13px}
.hint{font-size:12px;color:var(--muted)}
.err{font-size:12px;color:var(--crit);font-weight:500}
.choice{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.opt{border:1px solid var(--line-strong);border-radius:var(--r);padding:12px;cursor:pointer;background:var(--surface);display:flex;flex-direction:column;gap:4px;text-align:left}
.opt.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.opt b{font-size:14px}
.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.svc{border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.svc .row{justify-content:space-between}
.pill{font-size:10.5px;font-family:var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 4px}
.code{font-family:var(--f-mono);font-size:12px;background:var(--sunken);border:1px solid var(--line);border-radius:var(--r);padding:12px;overflow:auto;max-height:360px;white-space:pre;line-height:1.55}
.kv{display:grid;grid-template-columns:minmax(120px,max-content) minmax(0,1fr);gap:6px 14px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.risk-h{border-left:3px solid var(--crit)} .risk-m{border-left:3px solid var(--warn)} .risk-l{border-left:3px solid var(--line-strong)}
.notice{border:1px solid var(--line);border-left:4px solid var(--info);background:var(--info-soft);border-radius:var(--r);padding:10px 12px;font-size:13px}
.notice.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.notice.crit{border-left-color:var(--crit);background:var(--crit-soft)}
.notice.ok{border-left-color:var(--ok);background:var(--ok-soft)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:transparent;padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
.prog{display:flex;flex-direction:column;gap:8px}
.prog div{display:flex;gap:10px;align-items:center;font-size:13px}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line-strong);flex:none;display:grid;place-items:center;font-size:10px}
.dot.run{border-color:var(--accent);border-top-color:transparent;animation:spin 1s linear infinite}
.dot.done{background:var(--ok);border-color:var(--ok);color:#FFFFFF}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.dot.run{animation:none}}
.region{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.region.active{border-top:4px solid var(--ok)} .region.standby{border-top:4px solid var(--info)}
.toast{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:var(--r);font-size:13px;max-width:min(420px,calc(100vw - 40px));z-index:20;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.diff-add{color:var(--ok)} .diff-del{color:var(--crit)}
@media (max-width: 980px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px 16px;gap:10px}
  .brand{padding:0} .nav{flex-direction:row;overflow-x:auto;padding:0;flex:1 1 100%} .nav a{white-space:nowrap}
  .nav-label,.rail-foot{display:none}
  .split,.grid2,.grid3{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .choice{grid-template-columns:minmax(0,1fr)}
}
@media (max-width: 520px){
  .content{padding:16px 16px 40px} .topbar{padding:10px 16px}
  .kpis{grid-template-columns:minmax(0,1fr)}
}
</style>

function vApproval(a){
  if(!a) return "";

  const allowed = isOverride ? can("override") : can("approve");
  const why = self ? "You requested this release, so you cannot approve it." : !allowed ? (isOverride?"Only a platform admin can approve an override.":"Your role is not a reviewer for this product and environment.") : "";
  const ch=a.changes.map(c=>`<tr class="risk-${c.risk[0]}"><td><b>${c.a}</b></td><td class="mono">${c.type}</td><td class="mono">${c.id}</td><td>${c.risk==="high"?chip("crit","High"):c.risk==="medium"?chip("warn","Medium"):chip("ok","Low")}</td></tr><tr><td></td><td colspan="3" class="muted" style="padding-top:0">${esc(c.note)}</td></tr>`).join("");

  <div class="panel-b">
    ${isOverride?`<div class="notice crit">This change replaces a data store. It stays blocked until a platform admin approves this override. The normal reviewer approval is still required afterwards.</div>`:""}

    <span class="label">Evidence</span><dl class="kv">${ev}</dl>
    <div class="field"><label for="apComment">Comment</label><textarea id="apComment" rows="2" placeholder="Visible in the release record and in GitHub"></textarea></div>
    ${why?`<div class="notice warn">${esc(why)} Switch “Viewing as” to try another role.</div>`:""}
    <div class="row"><button class="btn pri" data-act="approve" data-id="${a.id}" ${why?"disabled":""}>${isOverride?"Approve override":"Approve and release"}</button><button class="btn" data-act="reject" data-id="${a.id}" ${why?"disabled":""}>Reject</button><span class="spacer"></span><span class="hint">Approved changes are applied by the release executor</span></div>

/* ---------------- Events ---------------- */
document.addEventListener("click", e=>{
  const t=e.target.closest("[data-act]"); if(!t) return; const a=t.dataset.act;
  if(t.tagName==="INPUT" && t.type==="checkbox"){} else if(t.tagName!=="A") e.preventDefault?.();
  const go=()=>render();
  switch(a){
    case "openProject": state.project=t.dataset.id; state.approval=null; location.hash="releases"; break;
    case "wStep": W.step=+t.dataset.n; go(); break;
    case "wNext": W.step=Math.min(6,W.step+1); go(); break;
    case "wPrev": W.step=Math.max(1,W.step-1); go(); break;
    case "wMode": W.mode=t.dataset.m; go(); break;
    case "wAdd": { const base=t.dataset.t.split(/[.:]/).pop().replace(/[^a-z]/gi,"").toLowerCase().slice(0,10)||"res"; let id=base,i=2; while(W.resources.some(r=>r.id===id)) id=base+i++; W.resources.push({id,t:t.dataset.t}); toast(`Added ${svcName(t.dataset.t)} as “${id}”`); go(); break; }
    case "wDel": W.resources.splice(+t.dataset.i,1); go(); break;
    case "cAdd": W.connections.push({kind:$("#cKind").value, from:$("#cFrom").value, to:$("#cTo").value, detail:$("#cDetail").value}); go(); break;
    case "cDel": W.connections.splice(+t.dataset.i,1); go(); break;
    case "wEnv": { const id=t.dataset.e; W.envs = t.checked ? [...new Set([...W.envs,id])] : W.envs.filter(x=>x!==id); go(); break; }
    case "wCreate": W.job={done:0}; go(); tick(); break;
    case "wReset": W.job=null; W.step=1; W.name="new-project"; go(); break;
    case "openApproval": state.approval=t.dataset.id; go(); break;
    case "approve": {
      const ap=APPROVALS.find(x=>x.id===t.dataset.id);
      if(ap.kind==="override"){ ap.kind="release"; ap.gate="passed"; ap.risk="medium"; ap.requester="Casey Moore"; const p=PROJECTS.find(x=>x.id===ap.project); p.stages[ap.env].s="awaiting"; p.stages[ap.env].g="pppp"; toast("Override recorded. The release now waits for normal reviewer approval."); go(); break; }
      APPROVALS=APPROVALS.filter(x=>x.id!==ap.id); state.approval=null;
      const p=PROJECTS.find(x=>x.id===ap.project); p.stages[ap.env].s="deploying";
      toast(`Approved ${ap.id}. The release executor is applying the reviewed change set to ${ENVS.find(e=>e.id===ap.env).name}.`); go();
      setTimeout(()=>{p.stages[ap.env].s="deployed"; if(route()==="releases"||route()==="projects") render();}, 2600); break; }
    case "reject": { const ap=APPROVALS.find(x=>x.id===t.dataset.id); APPROVALS=APPROVALS.filter(x=>x.id!==ap.id); state.approval=null; PROJECTS.find(x=>x.id===ap.project).stages[ap.env].s="rejected"; toast(`Rejected ${ap.id}. The environment was not changed.`); go(); break; }
    case "shareTab": state.shareTab=t.dataset.t; go(); break;
    case "reqAccess": { const s=SHARES.find(x=>x.id===t.dataset.id); const auto=s.approval==="auto"; SHARE_REQS.unshift({id:"shr-"+(90+SHARE_REQS.length), type:"Access request", resource:s.name, consumer:state.project+" · prod", access:s.access, approvers:auto?"Auto-approved (provider notified)":"Provider owner ("+s.owner+")", status:auto?"active":"pending", requester:me(), providerRole:s.pr==="pl-datalake"?"dl":"rev"}); state.shareTab="requests"; toast(auto?"Auto-approved within the share rule. Consumer PR opened.":"Access request sent to the provider owner."); go(); break; }
    case "shareApprove": { const r=SHARE_REQS.find(x=>x.id===t.dataset.id); r.status="active"; toast(`Approved ${r.id}. Infrastructure PRs opened on both sides.`); go(); break; }
    case "shareRevoke": { const r=SHARE_REQS.find(x=>x.id===t.dataset.id); r.status="rejected"; r.approvers="Revoked by "+me(); toast(`Revoked ${r.id}. PRs opened to remove access on both sides.`); go(); break; }
    case "offer": SHARE_REQS.unshift({id:"shr-"+(90+SHARE_REQS.length), type:"Share offer", resource:$("#ofRes").value, consumer:"scope: "+$("#ofScope").value+" · "+$("#ofAccess").value, access:$("#ofAccess").value, approvers:$("#ofApprovers").textContent, status:"pending", requester:me(), providerRole:"rev"}); state.shareTab="requests"; toast("Share offer submitted for approval."); go(); break;
    case "copyContract": { const txt=$("#contractJson").textContent; navigator.clipboard?.writeText(txt).then(()=>toast("Contract copied")).catch(()=>{const r=document.createRange(); r.selectNodeContents($("#contractJson")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast("Selected. Press Ctrl/Cmd+C to copy.");}); break; }
    case "toastOnly": toast(t.dataset.msg); break;
    case "adminTab": state.adminTab=t.dataset.t; go(); break;
    case "regToggle": REGIONS[+t.dataset.i].on=t.checked; toast(t.checked?`Mock: onboarding ${REGIONS[+t.dataset.i].id} (needs second admin for SCP update)`:`Mock: ${REGIONS[+t.dataset.i].id} disabled for new projects`); go(); break;
    case "foStart": FAILOVER={project:t.dataset.id, step:"second", by:me()}; go(); break;
    case "foCancel": FAILOVER=null; go(); break;
    case "foSecond": FAILOVER.step="run"; FAILOVER.n=0; go(); runFailover(); break;
    case "foReset": FAILOVER=null; go(); break;
  }
});
document.addEventListener("change", e=>{
  const t=e.target; const c=t.dataset.change; if(!c) return;
  if(c==="wPf"){ W.pf=t.value; W.pr=REGISTRY.find(p=>p.id===W.pf).products[0].id; }
  if(c==="wPr") W.pr=t.value; if(c==="wCls") W.cls=t.value;
  if(c==="wPrim") W.primary=t.value; if(c==="wSec") W.secondary=t.value; if(c==="wStrat") W.strategy=t.value;
  if(c==="projSel"){ state.project=t.value; state.approval=null; }
  if(c==="devProj"){ state.project=t.value; state.devRegion="primary"; } if(c==="devEnv") state.devEnv=t.value; if(c==="devRegion") state.devRegion=t.value;
  if(c==="ofScope"){ const wide=$("#ofScope").value!=="product"||$("#ofAccess").value!=="read"; $("#ofApprovers").textContent= wide?"Provider product owner + security reviewer":"Provider product owner"; return; }
  render();
});
document.addEventListener("input", e=>{
  const t=e.target; const k=t.dataset.input; if(!k) return;
  if(k==="wName"){ W.name=t.value.trim(); }
  if(k==="rid"){ W.resources[+t.dataset.i].id=t.value.trim(); return; }
  if(k==="wSearch"){ W.search=t.value; }
  const pos=t.selectionStart; render(); const n=document.getElementById(t.id); if(n){ n.focus(); try{n.setSelectionRange(pos,pos);}catch(_){} }
});
function tick(){ if(!W.job) return; if(W.job.done<6){ setTimeout(()=>{ if(!W.job) return; W.job.done++; if(route()==="new") render(); tick(); }, matchMedia("(prefers-reduced-motion: reduce)").matches?300:900);} else { PROJECTS.unshift({id:W.name,pf:W.pf,pr:W.pr,mode:W.mode,primary:W.primary,secondary:W.mode==="single"?"":W.secondary,strategy:W.mode==="dr"?(W.strategy==="warm"?"Warm standby":"Pilot light"):"—",commit:"0c1d2e3",msg:"Initial generated infrastructure",stages:{sandbox:{s:"deployed",v:"0c1d2e3",g:"ppp"},dev:{s:"deployed",v:"0c1d2e3",g:"ppp"},test:{s:"deployed",v:"0c1d2e3",g:"ppp"},stage:{s:"awaiting",v:"0c1d2e3",g:"pppp"},prod:{s:"idle",v:"—",g:""}},apps:[{repo:"(none yet)",lang:"—",slot:"—",type:"—"}]}); APPROVALS.push({id:"rel-"+(1044+APPROVALS.length),kind:"release",project:W.name,env:"stage",requester:"Jordan Lee",age:"just now",gate:"passed",risk:"low",changes:W.resources.map(r=>({a:"Add",type:svcName(r.t),id:r.id,risk:"low",note:"New resource"})),evidence:{tests:"Generated checks passed",provenance:"Signed",drift:"New stack",analyzer:"No external access"}}); renderNav(); } }
function runFailover(){ const st=()=>{ if(!FAILOVER||FAILOVER.step!=="run") return; if(FAILOVER.n<4){ FAILOVER.n++; if(route()==="resilience") render(); setTimeout(st, 800);} else { FAILOVER.step="done"; if(route()==="resilience") render(); } }; setTimeout(st,800); }

/* role selector */
const rs=$("#roleSel"); rs.innerHTML=Object.entries(ROLES).map(([k,r])=>`<option value="${k}" ${k===role?"selected":""}>${r.name} · ${r.title}</option>`).join("");
rs.addEventListener("change",()=>{ role=rs.value; toast(`Now viewing as ${me()}`); render(); });
render();
</script>
