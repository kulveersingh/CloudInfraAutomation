[project]
name = "cloudinfra-platform"
version = "0.1.0"
description = "CloudInfra self-service platform: control plane API, synthesis engine and provisioning worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.32",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pyyaml>=6.0",
    "cfn-lint>=1.12",
    "boto3>=1.34",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=app --cov-branch --cov-report=term-missing --cov-fail-under=100"
markers = ["vault: integration tests against the locked vault in Docker (§23); skipped when no vault answers"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 110
target-version = "py312"
