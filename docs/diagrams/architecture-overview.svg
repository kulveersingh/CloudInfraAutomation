<rect x="20" y="1030" width="1760" height="245" rx="10" fill="#FFFFFF" stroke="#B8C2CC" stroke-width="1.5"/>
<text x="34" y="1056" class="lane">How it flows</text>
<text x="40" y="1086" class="lg">① People use the platform UI; ② every UI action goes through the Project API, which validates against the registry and synthesizes files.</text>
<text x="40" y="1112" class="lg">③ The orchestrator creates the infrastructure repo (and application repos), GitHub environments, variables and one atomic commit.</text>
<text x="40" y="1138" class="lg">④ It bootstraps tagged deploy / CloudFormation / plan roles in each environment account; tags limit every role to its own project.</text>
<text x="40" y="1164" class="lg">⑤ GitHub Actions deploys Sandbox, DEV and TEST through OIDC; for STAGE and PROD it only creates change sets (plan).</text>
<text x="40" y="1190" class="lg">⑥ Test, scan and change-set evidence goes to the gate service; reviewers approve in the release console.</text>
<text x="40" y="1216" class="lg">⑦ Only after gates pass and a reviewer approves does the release executor apply the exact reviewed change to STAGE / PROD.</text>
<text x="40" y="1242" class="lg">⑧ SCPs and Tag Policies enforce tag rules in every account; build-once artifacts come from Shared Services.</text>
</svg>