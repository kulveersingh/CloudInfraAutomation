AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  CloudInfra platform control plane: ECS Fargate services (api, worker, ui) behind an ALB, with Aurora PostgreSQL
  Serverless v2. AWS services only.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnets for tasks and the database (at least two AZs)
  LoadBalancerSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  LoadBalancerScheme:
    Type: String
    AllowedValues: [internal, internet-facing]
    Default: internal
  AllowedClientCidr:
    Type: String
    Default: 10.0.0.0/8
    Description: Network allowed to reach the console
  CertificateArn:
    Type: String
    Description: ACM certificate for the console's HTTPS listener
  BackendImage:
    Type: String
    Description: ECR image URI for the api and worker services
  UiImage:
    Type: String
    Description: ECR image URI for the ui service
  DatabaseEngineVersion:
    Type: String
    Default: "16.6"
  GitHubMode:
    Type: String
    Default: local
  AwsMode:
    Type: String
    Default: local

Resources:
  # ---------- networking ----------
  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CloudInfra console load balancer
      VpcId: {Ref: VpcId}
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: {Ref: AllowedClientCidr}, Description: HTTPS}
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: {Ref: AllowedClientCidr}, Description: Redirect to HTTPS}

  ApplicationSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CloudInfra platform tasks
      VpcId: {Ref: VpcId}
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: {Ref: LoadBalancerSecurityGroup}
          Description: API from the load balancer
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: {Ref: LoadBalancerSecurityGroup}
          Description: Console from the load balancer

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CloudInfra Aurora PostgreSQL
      VpcId: {Ref: VpcId}
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: {Ref: ApplicationSecurityGroup}
          Description: PostgreSQL from platform tasks only

  # ---------- database ----------
  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: CloudInfra database subnets
      SubnetIds: {Ref: PrivateSubnetIds}

  DatabaseCluster:
    Type: AWS::RDS::DBCluster
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: aurora-postgresql
      EngineVersion: {Ref: DatabaseEngineVersion}
      DatabaseName: cloudinfra
      MasterUsername: cloudinfra_admin
      ManageMasterUserPassword: true
      StorageEncrypted: true
      DeletionProtection: true
      EnableIAMDatabaseAuthentication: true
      CopyTagsToSnapshot: true
      BackupRetentionPeriod: 7
      DBSubnetGroupName: {Ref: DatabaseSubnetGroup}
      VpcSecurityGroupIds:
        - {"Fn::GetAtt": [DatabaseSecurityGroup, GroupId]}
      ServerlessV2ScalingConfiguration:
        MinCapacity: 0.5
        MaxCapacity: 4

  DatabaseInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: aurora-postgresql
      DBClusterIdentifier: {Ref: DatabaseCluster}
      DBInstanceClass: db.serverless
      PubliclyAccessible: false

  # ---------- ECS ----------
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterSettings:
        - {Name: containerInsights, Value: enabled}

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: {RetentionInDays: 90}

  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: {RetentionInDays: 90}

  UiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: {RetentionInDays: 90}

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - {Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: "sts:AssumeRole"}
      ManagedPolicyArns:
        - {"Fn::Sub": "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"}
      Policies:
        - PolicyName: read-database-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ["secretsmanager:GetSecretValue"]
                Resource: {"Fn::GetAtt": [DatabaseCluster, MasterUserSecret.SecretArn]}

  ApplicationTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - {Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: "sts:AssumeRole"}

  ApiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: cloudinfra-api
      Cpu: "512"
      Memory: "1024"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform: {CpuArchitecture: ARM64, OperatingSystemFamily: LINUX}
      ExecutionRoleArn: {"Fn::GetAtt": [TaskExecutionRole, Arn]}
      TaskRoleArn: {"Fn::GetAtt": [ApplicationTaskRole, Arn]}
      ContainerDefinitions:
        - Name: api
          Image: {Ref: BackendImage}
          Essential: true
          PortMappings: [{ContainerPort: 8000}]
          Command: ["sh", "-c", "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
          Environment: &backend_environment
            - {Name: DATABASE_HOST, Value: {"Fn::GetAtt": [DatabaseCluster, Endpoint.Address]}}
            - {Name: DATABASE_PORT, Value: {"Fn::GetAtt": [DatabaseCluster, Endpoint.Port]}}
            - {Name: DATABASE_NAME, Value: cloudinfra}
            - {Name: DATABASE_USER, Value: cloudinfra_admin}
            - {Name: GITHUB_MODE, Value: {Ref: GitHubMode}}
            - {Name: AWS_MODE, Value: {Ref: AwsMode}}
            - {Name: LOCAL_STATE_DIR, Value: /tmp/cloudinfra}
          Secrets: &backend_secrets
            - Name: DATABASE_PASSWORD
              ValueFrom: {"Fn::Sub": "${DatabaseCluster.MasterUserSecret.SecretArn}:password::"}
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: {Ref: ApiLogGroup}
              awslogs-region: {Ref: "AWS::Region"}
              awslogs-stream-prefix: api

  WorkerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: cloudinfra-worker
      Cpu: "512"
      Memory: "1024"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform: {CpuArchitecture: ARM64, OperatingSystemFamily: LINUX}
      ExecutionRoleArn: {"Fn::GetAtt": [TaskExecutionRole, Arn]}
      TaskRoleArn: {"Fn::GetAtt": [ApplicationTaskRole, Arn]}
      ContainerDefinitions:
        - Name: worker
          Image: {Ref: BackendImage}
          Essential: true
          Command: ["python", "-m", "app.provisioning.worker"]
          Environment: *backend_environment
          Secrets: *backend_secrets
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: {Ref: WorkerLogGroup}
              awslogs-region: {Ref: "AWS::Region"}
              awslogs-stream-prefix: worker

  UiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: cloudinfra-ui
      Cpu: "256"
      Memory: "512"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform: {CpuArchitecture: ARM64, OperatingSystemFamily: LINUX}
      ExecutionRoleArn: {"Fn::GetAtt": [TaskExecutionRole, Arn]}
      ContainerDefinitions:
        - Name: ui
          Image: {Ref: UiImage}
          Essential: true
          PortMappings: [{ContainerPort: 80}]
          Environment:
            # The ALB routes /v1 straight to the api service; nginx only needs a resolvable placeholder upstream.
            - {Name: API_UPSTREAM, Value: "http://127.0.0.1:8000"}
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: {Ref: UiLogGroup}
              awslogs-region: {Ref: "AWS::Region"}
              awslogs-stream-prefix: ui

  # ---------- load balancer ----------
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: {Ref: LoadBalancerScheme}
      Subnets: {Ref: LoadBalancerSubnetIds}
      SecurityGroups: [{Ref: LoadBalancerSecurityGroup}]
      LoadBalancerAttributes:
        - {Key: routing.http.drop_invalid_header_fields.enabled, Value: "true"}

  ApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      TargetType: ip
      Protocol: HTTP
      Port: 8000
      VpcId: {Ref: VpcId}
      HealthCheckPath: /healthz

  UiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      TargetType: ip
      Protocol: HTTP
      Port: 80
      VpcId: {Ref: VpcId}
      HealthCheckPath: /

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: {Ref: LoadBalancer}
      Protocol: HTTPS
      Port: 443
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{CertificateArn: {Ref: CertificateArn}}]
      DefaultActions:
        - {Type: forward, TargetGroupArn: {Ref: UiTargetGroup}}

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: {Ref: LoadBalancer}
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: redirect
          RedirectConfig: {Protocol: HTTPS, Port: "443", StatusCode: HTTP_301}

  ApiListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: {Ref: HttpsListener}
      Priority: 10
      Conditions:
        - Field: path-pattern
          PathPatternConfig: {Values: ["/v1/*", "/healthz"]}
      Actions:
        - {Type: forward, TargetGroupArn: {Ref: ApiTargetGroup}}

  # ---------- services ----------
  ApiService:
    Type: AWS::ECS::Service
    DependsOn: [ApiListenerRule]
    Properties:
      Cluster: {Ref: Cluster}
      LaunchType: FARGATE
      DesiredCount: 2
      TaskDefinition: {Ref: ApiTaskDefinition}
      PropagateTags: SERVICE
      HealthCheckGracePeriodSeconds: 90
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups: [{Ref: ApplicationSecurityGroup}]
          Subnets: {Ref: PrivateSubnetIds}
      LoadBalancers:
        - {ContainerName: api, ContainerPort: 8000, TargetGroupArn: {Ref: ApiTargetGroup}}
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}

  WorkerService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: {Ref: Cluster}
      LaunchType: FARGATE
      DesiredCount: 1
      TaskDefinition: {Ref: WorkerTaskDefinition}
      PropagateTags: SERVICE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups: [{Ref: ApplicationSecurityGroup}]
          Subnets: {Ref: PrivateSubnetIds}
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}

  UiService:
    Type: AWS::ECS::Service
    DependsOn: [HttpsListener]
    Properties:
      Cluster: {Ref: Cluster}
      LaunchType: FARGATE
      DesiredCount: 2
      TaskDefinition: {Ref: UiTaskDefinition}
      PropagateTags: SERVICE
      HealthCheckGracePeriodSeconds: 30
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups: [{Ref: ApplicationSecurityGroup}]
          Subnets: {Ref: PrivateSubnetIds}
      LoadBalancers:
        - {ContainerName: ui, ContainerPort: 80, TargetGroupArn: {Ref: UiTargetGroup}}
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}

Outputs:
  ConsoleUrl:
    Value: {"Fn::Sub": "https://${LoadBalancer.DNSName}"}
  DatabaseEndpoint:
    Value: {"Fn::GetAtt": [DatabaseCluster, Endpoint.Address]}
  ClusterName:
    Value: {Ref: Cluster}
